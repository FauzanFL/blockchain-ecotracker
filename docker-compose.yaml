services:
  db:
    image: postgres:15-alpine
    container_name: ecotrack-db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: ecotrack-server
    env_file: .env
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ecotrack-web
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - server

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    container_name: ecotrack-simulator
    env_file: .env
    depends_on:
      - server

volumes:
  postgres_data:
